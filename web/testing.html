<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Testing · Stream characters</title>
    <link rel="stylesheet" href="./testing/style.css" />
    <script type="module" src="./testing/main.ts"></script>
  </head>
  <body>
    <main class="workspace">
      <div class="page-heading">
        <h1>Testing</h1>
        <span id="mode" class="subtle">Connecting</span>
      </div>
      <p class="hint">
        Uses saved settings. Keep <a href="/" target="_blank" rel="noopener">Activity</a> open for
        audio; this page stays silent.
      </p>
      <p id="mode-note" class="hint"></p>
      <p id="message" class="error" role="alert"></p>
      <form id="question-form">
        <label class="field" for="test-mode"
          ><span>Test</span
          ><select id="test-mode">
            <option value="full">Question → response → voice</option>
            <option value="response">Response only</option>
            <option value="voice">Voice only (fixed phrase)</option>
          </select></label
        >
        <label class="field" id="viewer-field" for="viewer"
          ><span>Viewer</span
          ><input id="viewer" type="text" maxlength="40" value="Streamer" autocomplete="off"
        /></label>
        <label class="field" id="question-field" for="question"
          ><span>Character: question</span
          ><textarea
            id="question"
            rows="4"
            maxlength="1042"
            placeholder="Name: your question…"
            aria-describedby="characters"
          ></textarea>
        </label>
        <p id="characters" class="hint"></p>
        <label class="field" id="voice-field" for="voice-character" hidden
          ><span>Character voice</span
          ><select id="voice-character"></select
        ></label>
        <div class="actions">
          <button id="submit" class="primary" type="submit" disabled>Run test</button
          ><button id="cancel" type="button" hidden>Cancel response test</button>
        </div>
      </form>
      <p id="submission-status" class="hint" role="status"></p>
      <p id="test-result" role="status"></p>
      <p id="test-status" class="hint" role="status"></p>
    </main>
  </body>
</html>
